default: &default
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  adapter: sqlite3
  database: storage/development.sqlite3

test:
  <<: *default
  adapter: sqlite3
  database: storage/test.sqlite3

# Production MUST use a durable Postgres DATABASE_URL (Railway Postgres, etc.).
# SQLite in the container is wiped on every deploy — never fall back to it here.
production:
  <<: *default
  adapter: postgresql
  encoding: unicode
  url: <%= ENV.fetch("DATABASE_URL") %>
