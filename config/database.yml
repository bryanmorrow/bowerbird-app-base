default: &default
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  adapter: sqlite3
  database: storage/development.sqlite3

test:
  <<: *default
  adapter: sqlite3
  database: storage/test.sqlite3

production:
  <<: *default
  <% if ENV["DATABASE_URL"].present? %>
  adapter: postgresql
  encoding: unicode
  url: <%= ENV["DATABASE_URL"] %>
  <% else %>
  adapter: sqlite3
  database: storage/production.sqlite3
  <% end %>
